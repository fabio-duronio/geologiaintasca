<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geologiaintasca – Cartografia geologica italiana</title>
  <meta name="description" content="Indice geografico delle risorse cartografiche geologiche italiane.">
  <!-- Anteprima nei social (Facebook, LinkedIn, WhatsApp, X) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="Geologiaintasca">
  <meta property="og:title" content="Geologiaintasca – Cartografia geologica italiana">
  <meta property="og:description" content="Indice geografico delle risorse cartografiche geologiche italiane: fogli CARG, Carta Geologica d'Italia 1:100.000, Journal of Maps, geoportali regionali.">
  <meta property="og:url" content="https://fabio-duronio.github.io/geologiaintasca/">
  <meta property="og:image" content="https://fabio-duronio.github.io/geologiaintasca/img/anteprima-social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Mappa d'Italia con i fogli geologici CARG e 1:100.000 e i punti degli articoli del Journal of Maps">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #222; }
    #map { height: 100%; }
    .riquadro { background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; line-height: 1.5; }
    .testata { padding: 6px 10px; max-width: 320px; }
    .testata h1 { font-size: 14px; margin: 0; }
    .testata > p { margin: 2px 0 0; color: #555; }
    .testata button { margin-top: 4px; font: inherit; color: #1a237e; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
    .info { display: none; margin-top: 6px; border-top: 1px solid #ddd; padding-top: 6px; max-height: 50vh; overflow: auto; }
    .info.aperto { display: block; }
    .info p { color: #222; }
    .legenda { padding: 6px 10px; line-height: 1.6; max-height: 60vh; overflow: auto; }
    .titolo-legenda { font: inherit; font-weight: bold; background: none; border: 0; padding: 0; cursor: pointer; color: #222; }
    .titolo-legenda::after { content: ' ▾'; color: #666; }
    .titolo-legenda[aria-expanded="false"]::after { content: ' ▸'; }
    .voci-legenda[hidden] { display: none; }
    .etichetta-foglio { font: 600 11px/1 system-ui, sans-serif; color: #333; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; white-space: nowrap; pointer-events: none; }
    .etichetta-foglio span { display: inline-block; transform: translate(-50%, -50%); }
    .gps a { font-size: 16px; line-height: 30px; text-align: center; cursor: pointer; }
    .gps a.attesa { opacity: .5; }
    .legenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border: 1px solid #555; }
    .avviso { padding: 4px 8px; display: none; }
    .avviso.attivo { display: block; }
    .leaflet-popup-content { font-size: 13px; max-height: 50vh; overflow: auto; }
    .sezione + .sezione { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd; }
    .sezione h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #666; margin: 0 0 2px; }
    .meta { color: #555; }
    .azioni { margin-top: 6px; }
    .copia-link { font: inherit; font-size: 11px; color: #1a237e; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
    .gruppo-jom { box-sizing: border-box; border-radius: 50%; background: #1a237e; color: #fff; border: 1.5px solid #fff;
                  font: bold 11px/1 system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
                  box-shadow: 0 0 2px rgba(0,0,0,.5); }
    .targa-jom { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: #5c6bc0; color: #fff;
                 border: 1.5px solid #fff; border-radius: 4px; padding: 3px 6px; font: bold 11px/1 system-ui, sans-serif;
                 box-shadow: 0 0 2px rgba(0,0,0,.5); }
    .targa-jom b { display: inline-block; margin-left: 4px; padding: 1px 4px; border-radius: 3px; background: #fff; color: #3949ab; }
    .elenco-jom { margin: 6px 0 0; padding-left: 20px; max-height: 40vh; overflow: auto; }
    .elenco-jom li { margin-bottom: 6px; }
    .opacita { display: flex; align-items: center; gap: 6px; margin: 0 0 4px 22px; font-size: 11px; color: #555; }
    .opacita input { flex: 1; min-width: 70px; margin: 0; }
    .opacita output { width: 32px; text-align: right; }
    .opacita[hidden] { display: none; }
    .ricerca { padding: 6px 8px; width: 260px; }
    .ricerca form { display: flex; gap: 4px; }
    .ricerca input { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; border: 1px solid #bbb; border-radius: 3px; }
    .ricerca button { font: inherit; padding: 3px 8px; border: 1px solid #bbb; border-radius: 3px; background: #f5f5f5; cursor: pointer; }
    .ricerca ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
    .ricerca li { padding: 3px 0; border-top: 1px solid #eee; cursor: pointer; color: #1a237e; }
    .ricerca li:hover { text-decoration: underline; }
    .ricerca li.gruppo, .ricerca li.meta { cursor: default; color: #666; }
    .ricerca li.gruppo { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding-top: 6px; border-top: 0; }
    .ricerca li.gruppo:hover, .ricerca li.meta:hover { text-decoration: none; }
    .ricerca { width: 300px; }
    .scala-num { padding: 2px 6px; margin-bottom: 2px !important; }
    @media (max-width: 600px) { .testata { max-width: 220px; } .ricerca { width: 200px; }
      /* su telefono l'attribuzione occupa tutta la larghezza in basso: la legenda sale sopra di lei */
      .leaflet-bottom.leaflet-left { bottom: 48px; } }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = L.map('map', { zoomControl: false });
  // ---------- Link diretti ----------
  // #zoom/lat/lon nell'indirizzo: la vista corrente, aggiornata a ogni spostamento.
  // ?carg=628, ?carta100k=141, ?doi=10.1080/…: all'apertura inquadrano l'elemento e ne aprono la scheda.
  const BASE_URL = location.origin + location.pathname;
  const vistaDaHash = () => {
    const m = location.hash.match(/^#(\d{1,2})\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    return m ? { z: +m[1], ll: [+m[2], +m[3]] } : null;
  };
  const vistaIniziale = vistaDaHash();
  map.setView(vistaIniziale ? vistaIniziale.ll : [41.9, 12.6], vistaIniziale ? vistaIniziale.z : 6);
  const hashVista = (ll, z) => `#${z}/${ll.lat.toFixed(5)}/${ll.lng.toFixed(5)}`;
  map.on('moveend', () => history.replaceState(null, '', BASE_URL + location.search + hashVista(map.getCenter(), map.getZoom())));
  const linkFoglio = (l, f) => `${BASE_URL}?${l.parametro}=${encodeURIComponent(f.properties.Foglio)}`;
  const linkArticolo = f => `${BASE_URL}?doi=${encodeURIComponent(f.properties.DOI)}`;
  const pulsanteLink = (url, testo) => `<button type="button" class="copia-link" data-url="${esc(url)}">🔗 ${testo}</button>`;
  L.control.zoom({ position: 'topright' }).addTo(map);

  // ---------- Posizione attuale (GPS del dispositivo) ----------
  const gps = L.control({ position: 'topright' });
  let miaPosizione = null;
  gps.onAdd = () => {
    const d = L.DomUtil.create('div', 'leaflet-bar gps');
    d.innerHTML = '<a href="#" role="button" title="Posizione attuale" aria-label="Posizione attuale">⌖</a>';
    const a = d.querySelector('a');
    a.onclick = ev => {
      ev.preventDefault();
      if (!navigator.geolocation) { alertaGps('Il dispositivo non fornisce la posizione.'); return; }
      a.classList.add('attesa');
      navigator.geolocation.getCurrentPosition(pos => {
        a.classList.remove('attesa');
        const ll = [pos.coords.latitude, pos.coords.longitude], acc = Math.round(pos.coords.accuracy);
        if (miaPosizione) miaPosizione.remove();
        miaPosizione = L.layerGroup([
          L.circle(ll, { radius: acc, color: '#1565c0', weight: 1, fillOpacity: 0.1, interactive: false }),
          L.circleMarker(ll, { radius: 6, color: '#fff', weight: 2, fillColor: '#1565c0', fillOpacity: 1 })
            .bindTooltip(`Sei qui (precisione circa ${acc} m)`)
        ]).addTo(map);
        map.setView(ll, Math.max(map.getZoom(), 15));
      }, err => {
        a.classList.remove('attesa');
        alertaGps(err.code === 1 ? 'Permesso di localizzazione negato.' : 'Posizione non disponibile.');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    };
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  gps.addTo(map);
  function alertaGps(testo) {
    L.popup().setLatLng(map.getCenter()).setContent(`<span class="meta">${testo}</span>`).openOn(map);
  }
  // ---------- Sfondi (licenze nel pannello Informazioni e nel README) ----------
  const sfondi = {
    'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap contributors' }),
    'OpenTopoMap (curve di livello)': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, subdomains: 'abc',
      attribution: '© OpenStreetMap contributors, SRTM · stile © OpenTopoMap (CC BY-SA)' }),
    // Tre servizi WMTS AGEA (voli 2022, 2023, 2024): ognuno copre regioni diverse ed è trasparente fuori
    // dalla sua copertura, quindi insieme formano un unico sfondo nazionale. Il volo più recente sta sopra.
    'Ortofoto AGEA 2022-2024 (20 cm)': L.layerGroup(['2022', '2023', '2024'].map(anno => L.tileLayer(
      `https://geoportale.agea.gov.it/image/rest/services/AgEA/Ortofoto_AgEA_${anno}/ImageServer/WMTS/tile/1.0.0/AgEA_Ortofoto_AgEA_${anno}/default/GoogleMapsCompatible/{z}/{y}/{x}`, {
        maxZoom: 19, maxNativeZoom: 18,
        attribution: anno === '2024' ? 'Ortofoto AGEA 2022-2024 © AGEA – Agenzia per le Erogazioni in Agricoltura (CC BY 4.0)' : '' }))),
    'Rilievo ombreggiato TINITALY': L.tileLayer.wms('https://tinitaly.pi.ingv.it/TINItaly_1_1/wms', {
      layers: 'tinitaly_hshd', format: 'image/png', version: '1.3.0', maxZoom: 19,
      attribution: 'TINITALY/1.1 © INGV (CC BY 4.0), doi:10.13127/tinitaly/1.1' })
  };
  sfondi['OpenStreetMap'].addTo(map);
  map.attributionControl.addAttribution('Dati: ISPRA, Journal of Maps, Crossref, ISTAT, riviste citate');

  // ---------- Utilità ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Il campo "Dettagli" (scripts/dettagli_popup.py) usa **grassetto** e [[url|testo]]: qui diventa HTML
  const daDettagli = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[\[(https?:\/\/[^|\]]+)\|([^\]]+)\]\]/g, (m, u, txt) => `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`)
    .replace(/\n/g, '<br>');
  const sezione = (titolo, corpo) => `<div class="sezione"><h3>${esc(titolo)}</h3>${corpo}</div>`;
  const maiuscola = s => { s = String(s || '').trim().toLowerCase(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
  // 'L'AQUILA' -> 'L'Aquila', 'S. GIOVANNI IN FIORE' -> 'S. Giovanni in Fiore'
  const nomeProprio = s => String(s || '').trim().toLowerCase()
    .replace(/(^|[\s'.-])([a-zà-ù])/g, (m, p, c) => p + c.toUpperCase())
    .replace(/ (Di|Del|Della|Dei|Delle|In|E|Al|Sul|Nel|De') /g, m => m.toLowerCase())
    .replace(/ (D|Dell|Nell|Sull)'/g, m => m.toLowerCase());

  function nelPoligono(x, y, anelli) {
    const dentro = r => { let c = false;
      for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
        const [xi, yi] = r[i], [xj, yj] = r[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
      } return c; };
    return dentro(anelli[0]) && !anelli.slice(1).some(dentro);
  }
  function contiene(f, lng, lat) {
    const g = f.geometry; if (!g) return false;
    const pol = g.type === 'MultiPolygon' ? g.coordinates : g.type === 'Polygon' ? [g.coordinates] : [];
    return pol.some(p => nelPoligono(lng, lat, p));
  }

  // ---------- Livelli dei dati (GeoJSON del repository) ----------
  const COLORI_CARG = { 'Stampato': '#FF0000', 'In attesa di stampa': '#A87000',
                        'In allestimento per la stampa': '#FFAA00', 'Rilevamento in corso': '#A3FF73' };
  const COLORE_JOM = '#1a237e', COLORE_JOM_REG = '#5c6bc0', COLORE_ALTRE = '#8e24aa';

  const livelli = [
    { nome: 'Journal of Maps', file: 'dati/journal_of_maps/jom_italia.geojson', colore: COLORE_JOM, punti: true,
      opzioni: { pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: 7, pane: 'punti', color: '#fff', weight: 1, bubblingMouseEvents: false, fillColor: COLORE_JOM, fillOpacity: 0.9 }) } },
    { nome: 'Progetto CARG 1:50.000', file: 'dati/carg/carg_50k_fogli.geojson', colore: '#FF0000', parametro: 'carg',
      opzioni: { interactive: false, style: f => ({ color: '#555', weight: 0.6,
        fillOpacity: COLORI_CARG[f.properties.Stato] ? 0.45 : 0, fillColor: COLORI_CARG[f.properties.Stato] || '#ffffff' }) } },
    { nome: "Carta Geologica d'Italia 1:100.000", file: 'dati/carta_100k/carta_100k_fogli.geojson', colore: '#6d4c41', visibile: false, parametro: 'carta100k',
      opzioni: { interactive: false, style: f => ({ color: '#6d4c41', weight: 1.2, dashArray: '6 3',
        fillColor: '#6d4c41', fillOpacity: f.properties.Copia_digitale === 'Sì' ? 0.12 : 0.03 }) } },
    { nome: 'Geoportali regionali', file: 'dati/geoportali_regionali/geoportali_regionali.geojson', colore: '#2e8b57', visibile: false,
      opzioni: { interactive: false, style: { color: '#2e8b57', weight: 2, fillOpacity: 0.03 } } },
    // Studi su un'intera regione o provincia (area vasta) e articoli con la sola regione nel titolo, ancora da localizzare
    { nome: 'JoM – studi a scala regionale', file: 'dati/journal_of_maps/jom_regionali.geojson', colore: COLORE_JOM_REG,
      punti: true, regionale: true, visibile: false, opzioni: {} },
    // Carte allegate ad articoli di altre riviste (es. Geological Field Trips and Maps), aggiunte a mano
    // quando un post di Geologiaintasca ne parla: dati/altre_riviste/localizzazioni.csv
    { nome: 'Altre riviste', file: 'dati/altre_riviste/altre_riviste.geojson', colore: COLORE_ALTRE, punti: true,
      opzioni: { pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: 7, pane: 'punti', color: '#fff', weight: 1, bubblingMouseEvents: false, fillColor: COLORE_ALTRE, fillOpacity: 0.9 }) } }
  ];
  // Livelli di articoli (ricerca, ?doi=): Journal of Maps, JoM regionale, Altre riviste
  const livelliJom = () => [livelli[0], livelli[4], livelli[5]];

  // ---------- Geologia ISPRA (servizi WMS, interrogabili al clic) ----------
  map.createPane('geologia'); map.getPane('geologia').style.zIndex = 350;  // sotto i fogli e i punti
  // Punti degli articoli sempre sopra fogli e poligoni (altrimenti l'ordine dipende da quale file arriva prima)
  map.createPane('punti'); map.getPane('punti').style.zIndex = 450;
  const SINA = 'https://sinacloud.isprambiente.it/arcgisgeo/';
  const geologia = [
    // WMS, dal basso: unità geologiche, depositi quaternari, limiti geologici, elementi tettonici,
    // elementi strutturali e plicativi, giaciture. Al clic: unità (REST 9) e deposito quaternario (REST 8).
    { nome: 'Geologia CARG 1:25.000 (ISPRA)', servizio: 'geo/SGI_ISPRA_Geologia25k', wms: '0,1,2,3,4,7', identifica: '9,8', zoomMin: 11,
      scheda: r => { const u = (r.find(x => x.layerId === 9) || {}).attributes, d = (r.find(x => x.layerId === 8) || {}).attributes;
        const a = u || {}; return [
        a.nome && `<b>${esc(a.nome)}</b>${a.sigla_unita_geologica ? ` (${esc(a.sigla_unita_geologica.trim())})` : ''}`,
        a.siglatipo && `<span class="meta">Tipo:</span> ${esc(maiuscola(a.siglatipo))}`,
        a.eta_inferiore && `<span class="meta">Età:</span> ${esc(maiuscola(a.eta_inferiore))}` +
          (a.eta_superiore && a.eta_superiore !== a.eta_inferiore ? ` – ${esc(maiuscola(a.eta_superiore))}` : ''),
        d && d.tipo && `<span class="meta">Deposito quaternario:</span> ${esc(maiuscola(d.tipo))}`,
        (a.foglio || (d && d.foglio)) && `<span class="meta">Foglio:</span> ${esc(nomeProprio(a.foglio || d.foglio))}`
      ]; } },
    // WMS, dal basso: unità geologiche, limiti, tettonica, tracce delle sezioni, stratimetria e i simboli puntuali
    // (sondaggi, pozzi per idrocarburi e per acqua, miniere, emissioni gassose, cave, forme carsiche,
    // località d'interesse, sorgenti). Tettonica, sezioni e stratimetria ISPRA le disegna fino a 1:22.500
    // (zoom 14): oltre, le tessere dello zoom 14 vengono ingrandite (maxNativeZoom) e restano visibili.
    { nome: 'Geologia 1:100.000 (ISPRA)', servizio: 'servizi/geologica100k', wms: '0,1,2,3,14,5,6,7,8,9,10,11,12,13', identifica: '16', zoomMin: 10, zoomNativoMax: 14,
      scheda: r => { const a = (r[0] || {}).attributes || {}; return [
        a.NOME_FORMAZIONE && `<b>${esc(maiuscola(a.NOME_FORMAZIONE))}</b>${(a.Sigla || '').trim() ? ` (${esc(a.Sigla.trim())})` : ''}`,
        a.ETA_FORMAZIONE && `<span class="meta">Età:</span> ${esc(maiuscola(a.ETA_FORMAZIONE))}`
      ]; } }
  ];
  geologia.forEach(g => {
    g.layer = L.tileLayer.wms(SINA + 'services/' + g.servizio + '/MapServer/WMSServer', {
      layers: g.wms, format: 'image/png', transparent: true, version: '1.3.0', opacity: 0.75,
      pane: 'geologia', maxZoom: 19, maxNativeZoom: g.zoomNativoMax || 19,  // niente minZoom: Leaflet disattiverebbe la casella nel controllo
      attribution: 'Geologia: © ISPRA – Servizio Geologico d\'Italia'
    });
  });

  // JSONP: i servizi ISPRA non abilitano CORS, ma il REST di ArcGIS accetta il parametro "callback"
  let nJsonp = 0;
  function jsonp(url, ms = 10000) {
    return new Promise((ok, ko) => {
      const cb = 'igcJsonp' + (++nJsonp), s = document.createElement('script');
      const fine = () => { delete window[cb]; s.remove(); clearTimeout(t); };
      const t = setTimeout(() => { fine(); ko(new Error('timeout')); }, ms);
      window[cb] = d => { fine(); ok(d); };
      s.onerror = () => { fine(); ko(new Error('rete')); };
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }
  function identifica(g, ll) {
    // Oltre lo zoom nativo il servizio non risponde più alla scala reale: si interroga con l'estensione
    // che la mappa avrebbe allo zoom nativo massimo, centrata sul punto cliccato.
    const z = map.getZoom(), zn = Math.min(z, g.zoomNativoMax || z), sz = map.getSize();
    const c = map.project(ll, zn), meta = sz.divideBy(2);
    const b = L.latLngBounds(map.unproject(c.subtract(meta), zn), map.unproject(c.add(meta), zn));
    const q = new URLSearchParams({ geometry: `${ll.lng},${ll.lat}`, geometryType: 'esriGeometryPoint', sr: 4326,
      layers: 'visible:' + g.identifica, tolerance: 2, returnGeometry: false, f: 'json',
      mapExtent: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','), imageDisplay: `${sz.x},${sz.y},96` });
    return jsonp(SINA + 'rest/services/' + g.servizio + '/MapServer/identify?' + q);
  }

  // ---------- Controllo dei livelli (ordine fisso) ----------
  // Journal of Maps: più articoli possono avere le stesse coordinate (centroide dello stesso comune o della
  // stessa regione). Livello principale: un articolo è un cerchio, più articoli un cerchio con il numero.
  // Livello regionale: sempre una targhetta con il nome dell'area (e il numero, se più di uno).
  // Al clic su un gruppo: l'elenco di tutti gli articoli, dal più recente.
  function aggiungiPunti(l, features) {
    const gruppo = l.layer;
    const perPunto = new Map();
    features.forEach(f => {
      const k = f.geometry.coordinates.join(',');
      if (!perPunto.has(k)) perPunto.set(k, []);
      perPunto.get(k).push(f);
    });
    perPunto.forEach(fs => {
      fs.forEach(f => { f._livello = l; });
      if (l.regionale) return aggiungiTarga(gruppo, fs);
      if (fs.length === 1) {
        const f = fs[0], ll = L.GeoJSON.coordsToLatLng(f.geometry.coordinates);
        const m = l.opzioni.pointToLayer(f, ll);
        m.feature = f;
        m.bindPopup(`<b>${esc(f.properties.Title)}</b><br>${daDettagli(f.properties.Dettagli)}` +
          (f.properties.DOI ? `<div class="azioni">${pulsanteLink(linkArticolo(f), "Copia link all'articolo")}</div>` : ''));
        f._simbolo = m;
        gruppo.addLayer(m);
        return;
      }
      fs.sort((a, b) => (b.properties.Anno || 0) - (a.properties.Anno || 0));
      const p0 = fs[0].properties;
      const lato = fs.length < 10 ? 20 : 24;
      const m = L.marker(L.GeoJSON.coordsToLatLng(fs[0].geometry.coordinates), {
        icon: L.divIcon({ className: '', iconSize: [lato, lato],
          html: `<div class="gruppo-jom" style="width:${lato}px;height:${lato}px;background:${l.colore}">${fs.length}</div>` }),
        title: `${fs.length} articoli – ${p0.Location}`, keyboard: true });
      // Riga «Posizione» di ciascun articolo (stesso punto, ma l'origine può essere manuale o automatica)
      const posizione = [...new Set(fs.map(f => (f.properties.Dettagli || '').split('\n')
        .find(r => r.startsWith('**Posizione:**'))).filter(Boolean))].join('\n');
      m.bindPopup(`<b>${fs.length} articoli – ${esc(p0.Location)}</b>` +
        (posizione ? `<br><span class="meta">${daDettagli(posizione)}</span>` : '') +
        elencoJom(fs), { maxWidth: 340 });
      fs.forEach(f => { f._simbolo = m; });
      gruppo.addLayer(m);
    });
  }
  // Elenco degli articoli di un gruppo; nel livello regionale ogni voce dice anche l'area e lo stato
  function elencoJom(fs, regionale) {
    return '<ol class="elenco-jom">' + fs.map(f => {
      const pr = f.properties, url = /^https:\/\//.test(pr.URL || '') ? pr.URL : '';
      const stato = !regionale ? '' : pr.Ambito === 'Regionale' ? ` · ${esc(pr.Location)}, area vasta` : ' · localizzazione da completare';
      return `<li><b>${esc(pr.Title)}</b><br><span class="meta">${esc(pr.Anno || 's.d.')} · ${esc(pr.Licenza || '')}${stato}</span>` +
        (url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">Articolo (DOI)</a>` : '') +
        (pr.DOI ? ' · ' + pulsanteLink(linkArticolo(f), 'link') : '') + '</li>';
    }).join('') + '</ol>';
  }
  function aggiungiTarga(gruppo, fs) {
    fs.sort((a, b) => (b.properties.Anno || 0) - (a.properties.Anno || 0));
    // Nome della targhetta: il luogo più frequente nel gruppo (di solito la regione)
    const conta = new Map();
    fs.forEach(f => conta.set(f.properties.Location, (conta.get(f.properties.Location) || 0) + 1));
    const nome = [...conta].sort((a, b) => b[1] - a[1])[0][0];
    const m = L.marker(L.GeoJSON.coordsToLatLng(fs[0].geometry.coordinates), {
      icon: L.divIcon({ className: '', iconSize: null,
        html: `<div class="targa-jom">${esc(nome)}${fs.length > 1 ? `<b>${fs.length}</b>` : ''}</div>` }),
      title: fs.length > 1 ? `${fs.length} articoli – ${nome}` : `${fs[0].properties.Title}`, keyboard: true });
    if (fs.length === 1) {
      const f = fs[0];
      m.bindPopup(`<b>${esc(f.properties.Title)}</b><br>${daDettagli(f.properties.Dettagli)}` +
        (f.properties.DOI ? `<div class="azioni">${pulsanteLink(linkArticolo(f), "Copia link all'articolo")}</div>` : ''));
    } else {
      m.bindPopup(`<b>${fs.length} articoli – ${esc(nome)}</b>` + elencoJom(fs, true), { maxWidth: 340 });
    }
    fs.forEach(f => { f._simbolo = m; });
    gruppo.addLayer(m);
  }

  // Controllo dei livelli: per la geologia ISPRA un cursore di opacità sotto la voce, visibile solo a livello acceso.
  const ControlloLivelli = L.Control.Layers.extend({
    _addItem(obj) {
      const label = L.Control.Layers.prototype._addItem.call(this, obj);
      const g = geologia.find(x => x.layer === obj.layer);
      if (!g) return label;
      const d = document.createElement('div'), pct = Math.round(g.layer.options.opacity * 100);
      d.className = 'opacita';
      d.innerHTML = `<span>Opacità</span><input type="range" min="0" max="100" value="${pct}" aria-label="Opacità ${esc(g.nome)}"><output>${pct}%</output>`;
      const r = d.querySelector('input'), o = d.querySelector('output');
      r.oninput = () => { g.layer.setOpacity(r.value / 100); o.textContent = r.value + '%'; };
      d.hidden = !this._map.hasLayer(obj.layer);
      label.querySelector('input').addEventListener('change', e => { d.hidden = !e.target.checked; });
      L.DomEvent.disableClickPropagation(d);
      label.after(d);
      return label;
    }
  });
  const controllo = new ControlloLivelli(sfondi, {}, { collapsed: window.innerWidth < 900, position: 'topright' }).addTo(map);
  const etichetta = l => `<span style="color:${l.colore}">■</span> ${l.nome}` + (l.dati ? ` (${l.dati.length})` : '');
  const etichettaGeo = g => `<span style="color:#8d6e63">▦</span> ${g.nome}`;
  function riempiControllo() {
    // Ordine per scala e priorità: 1:100.000, 1:50.000, 1:25.000, geoportali, Journal of Maps, Altre riviste
    const ordine = [[livelli[2], etichetta], [geologia[1], etichettaGeo], [livelli[1], etichetta],
                    [geologia[0], etichettaGeo], [livelli[3], etichetta], [livelli[0], etichetta], [livelli[4], etichetta],
                    [livelli[5], etichetta]];
    ordine.forEach(([x]) => controllo.removeLayer(x.layer));
    ordine.forEach(([x, f]) => controllo.addOverlay(x.layer, f(x)));
  }
  livelli.forEach(l => {
    l.layer = L.geoJSON(null, l.opzioni);
    if (l.visibile !== false) l.layer.addTo(map);
  });
  riempiControllo();
  Promise.allSettled(livelli.map(l => fetch(l.file)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(dati => {
      l.dati = dati.features;
      if (l.punti) aggiungiPunti(l, dati.features); else l.layer.addData(dati);
    })
    .catch(e => console.error('Impossibile caricare', l.file, e))))
    .then(() => { riempiControllo(); stileCarg(); aggiornaEtichette(); apriDaIndirizzo(); });

  function apriDaIndirizzo() {
    const q = new URLSearchParams(location.search), num = v => String(v || '').trim().toLowerCase().replace(/^0+(?=\d)/, '');
    let fatto = false;
    [livelli[1], livelli[2]].forEach(l => {
      const v = q.get(l.parametro); if (!v || fatto) return;
      const f = (l.dati || []).find(x => num(x.properties.Foglio) === num(v)); if (f) { vaiFoglio(l, f); fatto = true; }
    });
    const doi = (q.get('doi') || '').trim().toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, '');
    if (doi && !fatto) {
      const f = livelliJom().flatMap(l => l.dati || []).find(x => String(x.properties.DOI || '').toLowerCase() === doi);
      if (f) { vaiArticolo(f); fatto = true; }
    }
    // L'indirizzo torna «pulito»: da qui in poi conta solo la vista (#zoom/lat/lon)
    if (location.search) history.replaceState(null, '', BASE_URL + hashVista(map.getCenter(), map.getZoom()));
  }

  // Pulsanti «Copia link» nei popup
  map.getContainer().addEventListener('click', ev => {
    const b = ev.target.closest('.copia-link'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    const fatto = () => { const t = b.textContent; b.textContent = '✓ Link copiato'; setTimeout(() => { b.textContent = t; }, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(b.dataset.url).then(fatto, () => prompt('Copia il link:', b.dataset.url));
    else prompt('Copia il link:', b.dataset.url);
  });

  // Numeri dei fogli CARG al centro di ogni foglio, da zoom 9 e solo per i fogli visibili sullo schermo
  const etichetteCarg = L.layerGroup().addTo(map);
  function aggiornaEtichette() {
    etichetteCarg.clearLayers();
    const l = livelli[1];
    if (!l.dati || !map.hasLayer(l.layer) || map.getZoom() < 9) return;
    const vista = map.getBounds().pad(0.2);
    l.dati.forEach(f => {
      if (!f._centro) f._centro = L.geoJSON(f).getBounds().getCenter();
      if (vista.contains(f._centro)) etichetteCarg.addLayer(L.marker(f._centro, { interactive: false, keyboard: false,
        icon: L.divIcon({ className: 'etichetta-foglio', iconSize: null, html: `<span>${esc(f.properties.Foglio)}</span>` }) }));
    });
  }
  map.on('zoomend moveend overlayadd overlayremove', aggiornaEtichette);

  // Con la geologia accesa i fogli CARG diventano quasi trasparenti, per non coprirne i colori
  function stileCarg() {
    const geo = geologia.some(g => map.hasLayer(g.layer));
    livelli[1].layer.setStyle(f => ({ fillOpacity: COLORI_CARG[f.properties.Stato] ? (geo ? 0.08 : 0.45) : 0 }));
  }
  map.on('overlayadd overlayremove', stileCarg);

  // Il popup del clic riassume i livelli accesi in quel momento: se si accende o spegne un livello
  // non è più valido e si chiude.
  let popupClic = null;
  map.on('overlayadd overlayremove', () => { if (popupClic) { map.closePopup(popupClic); popupClic = null; } });

  // ---------- Clic sulla mappa: fogli, geoportali e geologia nello stesso popup ----------
  map.on('click', e => {
    const { lat, lng } = e.latlng;
    let html = '';
    livelli.filter(l => !l.punti && l.dati && map.hasLayer(l.layer)).forEach(l => {
      l.dati.filter(f => contiene(f, lng, lat)).forEach(f => {
        html += sezione(l.nome, `<b>${esc(f.properties.Title)}</b><br>${daDettagli(f.properties.Dettagli)}` +
          (l.parametro ? `<div class="azioni">${pulsanteLink(linkFoglio(l, f), 'Copia link al foglio')}</div>` : ''));
      });
    });
    const attive = geologia.filter(g => map.hasLayer(g.layer) && map.getZoom() >= g.zoomMin);
    attive.forEach((g, i) => { html += `<div class="sezione" id="geo${i}"><h3>${esc(g.nome)}</h3><span class="meta">Interrogazione in corso…</span></div>`; });
    if (!html) return;
    html += `<div class="sezione azioni">${pulsanteLink(BASE_URL + hashVista(e.latlng, Math.max(map.getZoom(), 12)), 'Copia link a questo punto')}</div>`;
    // Il contenuto è un elemento DOM: popup.update() lo conserva quando arrivano le risposte di ISPRA
    const box = document.createElement('div'); box.innerHTML = html;
    const popup = popupClic = L.popup({ maxWidth: 320 }).setLatLng(e.latlng).setContent(box).openOn(map);
    attive.forEach((g, i) => identifica(g, e.latlng)
      .then(d => {
        const righe = (d.results || []).length ? g.scheda(d.results).filter(Boolean).join('<br>') : '';
        return righe || '<span class="meta">Nessuna unità in questo punto.</span>';
      })
      .catch(() => '<span class="meta">Servizio ISPRA non raggiungibile.</span>')
      .then(righe => {
        const el = box.querySelector('#geo' + i);
        if (el) { el.innerHTML = `<h3>${esc(g.nome)}</h3>${righe}`; if (popup.isOpen()) popup.update(); }
      }));
  });

  // ---------- Avviso di scala per la geologia ----------
  const avviso = L.control({ position: 'bottomright' });
  avviso.onAdd = () => L.DomUtil.create('div', 'riquadro avviso');
  avviso.addTo(map);
  function aggiornaAvviso() {
    const lontane = geologia.filter(g => map.hasLayer(g.layer) && map.getZoom() < g.zoomMin);
    const el = avviso.getContainer();
    el.innerHTML = lontane.map(g => `${esc(g.nome)}: avvicinati per vederla`).join('<br>');
    el.classList.toggle('attivo', lontane.length > 0);
  }
  map.on('zoomend overlayadd overlayremove', aggiornaAvviso);

  // ---------- Scala: barra metrica e rapporto numerico (a 96 dpi, al centro della mappa) ----------
  L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);
  const scalaNum = L.control({ position: 'bottomright' });
  scalaNum.onAdd = () => L.DomUtil.create('div', 'riquadro scala-num');
  scalaNum.addTo(map);
  function aggiornaScala() {
    const lat = map.getCenter().lat * Math.PI / 180;
    const mPerPx = 40075016.686 * Math.cos(lat) / Math.pow(2, map.getZoom() + 8);
    const n = mPerPx / 0.0254 * 96, p = Math.pow(10, Math.floor(Math.log10(n)) - 1);
    scalaNum.getContainer().textContent = '1:' + (Math.round(n / p) * p).toLocaleString('it-IT');
  }
  map.on('zoomend moveend', aggiornaScala); aggiornaScala();

  // ---------- Ricerca ----------
  // 1) Subito, mentre si scrive, nei dati già caricati: fogli CARG e 1:100.000 (numero o nome),
  //    articoli di Journal of Maps e Altre riviste (titolo o luogo), coordinate «lat, lon».
  // 2) Con Invio o con il pulsante, anche tra le località di OpenStreetMap (Nominatim): le sue regole d'uso
  //    vietano le richieste durante la digitazione e ammettono al massimo una richiesta al secondo.
  const ricerca = L.control({ position: 'topleft' });
  let ultimaRicerca = 0, segnaposto = null;
  const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ').trim();
  const numeroFoglio = t => String(t || '').toLowerCase().replace(/^0+(?=\d)/, '');
  function segna(ll, testo) {
    if (segnaposto) segnaposto.remove();
    segnaposto = L.circleMarker(ll, { radius: 7, color: '#d32f2f', weight: 2, fillOpacity: 0.2 }).addTo(map);
    if (testo) segnaposto.bindTooltip(testo).openTooltip();
  }
  function coordinate(q) {  // «42.3498, 13.3995», «42,3498 13,3995», «42.3498N 13.3995E»; ordine invertito riconosciuto
    const m = q.match(/^\s*(-?\d{1,2}(?:[.,]\d+)?)\s*°?\s*[NnSs]?\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)\s*°?\s*[EeOoWw]?\s*$/);
    if (!m) return null;
    let a = parseFloat(m[1].replace(',', '.')), b = parseFloat(m[2].replace(',', '.'));
    const inItalia = (lat, lon) => lat >= 35 && lat <= 48 && lon >= 6 && lon <= 19;
    if (inItalia(a, b)) return [a, b];
    if (inItalia(b, a)) return [b, a];
    return null;
  }
  function vaiFoglio(l, f) {
    if (!map.hasLayer(l.layer)) map.addLayer(l.layer);
    const b = L.geoJSON(f).getBounds(); map.fitBounds(b, { maxZoom: 12 });
    L.popup({ maxWidth: 320 }).setLatLng(b.getCenter())
      .setContent(`<b>${esc(f.properties.Title)}</b><br>${daDettagli(f.properties.Dettagli)}` +
        `<div class="azioni">${pulsanteLink(linkFoglio(l, f), 'Copia link al foglio')}</div>`).openOn(map);
  }
  function vaiArticolo(f) {
    const l = f._livello || livelli[0];
    if (!map.hasLayer(l.layer)) map.addLayer(l.layer);
    const ll = L.GeoJSON.coordsToLatLng(f.geometry.coordinates);
    map.setView(ll, Math.max(map.getZoom(), l.regionale ? 8 : 11));
    if (f._simbolo) f._simbolo.openPopup();
  }
  function cercaNeiDati(q) {
    const nq = norm(q), num = numeroFoglio(q.trim()), out = [];
    if (nq.length < 2 && !/^\d+$/.test(nq)) return out;
    const fogli = (l, gruppo) => (l.dati || []).filter(f => {
      const p = f.properties;
      return String(p.Foglio || '').split('-').map(numeroFoglio).includes(num) || (nq.length >= 2 && norm(p.Location).includes(nq));
    }).slice(0, 5).map(f => ({ gruppo, testo: f.properties.Title, vai: () => vaiFoglio(l, f) }));
    out.push(...fogli(livelli[1], 'Fogli CARG 1:50.000'), ...fogli(livelli[2], "Fogli Carta Geologica d'Italia 1:100.000"));
    livelliJom().forEach(l => {
      const jom = nq.length < 3 ? [] : (l.dati || []).filter(f => norm(f.properties.Title).includes(nq) || norm(f.properties.Location).includes(nq))
        .sort((a, b) => (b.properties.Anno || 0) - (a.properties.Anno || 0)).slice(0, 8);
      out.push(...jom.map(f => ({ gruppo: l.nome, testo: `${f.properties.Title} (${f.properties.Anno || 's.d.'})`, vai: () => vaiArticolo(f) })));
    });
    return out;
  }
  ricerca.onAdd = () => {
    const d = L.DomUtil.create('div', 'riquadro ricerca');
    d.innerHTML = '<form><input type="search" placeholder="Foglio, località, parola chiave, lat, lon" aria-label="Cerca">' +
      '<button type="submit">Cerca</button></form><ul></ul>';
    const f = d.querySelector('form'), inp = d.querySelector('input'), ul = d.querySelector('ul'), btn = d.querySelector('button');
    const voce = (r) => {
      const li = document.createElement('li'); li.textContent = r.testo;
      li.onclick = ev => {
        ev.stopPropagation();  // la voce viene tolta dalla lista: senza questo Leaflet vedrebbe un clic sulla mappa
        r.vai(); setTimeout(() => { ul.innerHTML = ''; }, 0);
      };
      return li;
    };
    const titolo = t => { const li = document.createElement('li'); li.className = 'gruppo'; li.textContent = t; return li; };
    function mostra(risultati, extra) {
      ul.innerHTML = '';
      let ultimo = null;
      risultati.forEach(r => { if (r.gruppo !== ultimo) { ul.appendChild(titolo(r.gruppo)); ultimo = r.gruppo; } ul.appendChild(voce(r)); });
      if (extra) ul.insertAdjacentHTML('beforeend', extra);
    }
    function locali() {
      const q = inp.value.trim(), c = coordinate(q), ris = [];
      if (c) ris.push({ gruppo: 'Coordinate', testo: `${c[0].toFixed(5)}, ${c[1].toFixed(5)}`, vai: () => {
        map.setView(c, 15); segna(c, `${c[0].toFixed(5)}, ${c[1].toFixed(5)}`);
      } });
      return ris.concat(cercaNeiDati(q));
    }
    let attesa;
    inp.addEventListener('input', () => {
      clearTimeout(attesa);
      attesa = setTimeout(() => {
        const q = inp.value.trim();
        if (!q) { ul.innerHTML = ''; return; }
        const r = locali();
        mostra(r, '<li class="meta">Invio: cerca anche tra le località</li>');
      }, 200);
    });
    f.onsubmit = ev => {
      ev.preventDefault();
      const q = inp.value.trim(), loc = locali();
      if (!q) return;
      if (coordinate(q)) { mostra(loc); return; }  // coordinate: niente richiesta a Nominatim
      if (Date.now() - ultimaRicerca < 1000) return;
      ultimaRicerca = Date.now(); btn.disabled = true;
      mostra(loc, '<li class="meta">Ricerca delle località in corso…</li>');
      const url = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
        q, format: 'jsonv2', countrycodes: 'it', limit: 5, 'accept-language': 'it' });
      fetch(url).then(r => r.json()).then(ris => {
        const luoghi = ris.map(x => ({ gruppo: 'Località (OpenStreetMap)', testo: x.display_name, vai: () => {
          const [s, n, w, e] = x.boundingbox.map(Number);
          map.fitBounds([[s, w], [n, e]], { maxZoom: 14 }); segna([+x.lat, +x.lon]);
        } }));
        const tutti = loc.concat(luoghi);
        mostra(tutti, tutti.length ? '' : '<li class="meta">Nessun risultato.</li>');
      }).catch(() => { mostra(loc, '<li class="meta">Ricerca delle località non disponibile.</li>'); })
        .finally(() => { btn.disabled = false; });
    };
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  };

  // ---------- Testata e informazioni (stessi testi del README) ----------
  const testata = L.control({ position: 'topleft' });
  testata.onAdd = () => {
    const d = L.DomUtil.create('div', 'riquadro testata');
    d.innerHTML = `
      <h1>Geologiaintasca – Cartografia geologica italiana</h1>
      <button type="button" aria-expanded="false">Informazioni e fonti</button>
      <div class="info">
        <p>Indice geografico delle risorse cartografiche geologiche italiane. Riunisce i rimandi a dati di istituzioni nazionali,
        enti regionali e ricerca accademica, oggi distribuiti su portali diversi.</p>
        <p>Dati, fonti e licenze:
        <a href="https://github.com/fabio-duronio/geologiaintasca" target="_blank" rel="noopener">GitHub</a>.</p>
        <p><b>Fonti</b><br>
        Fogli CARG: © ISPRA – Servizio Geologico d'Italia, dati di CARG-GATE, licenza CC BY 4.0.<br>
        Carta 1:100.000: © ISPRA – Servizio Geologico d'Italia; indicizzati quadro d'unione e schede del catalogo, le scansioni restano sul sito ISPRA.<br>
        Geologia 1:25.000 e 1:100.000: © ISPRA – Servizio Geologico d'Italia, servizi di visualizzazione WMS; le immagini e le informazioni al clic sono fornite direttamente da ISPRA.<br>
        Confini amministrativi: © ISTAT, licenza CC BY 4.0.<br>
        Sfondi: © OpenStreetMap contributors (ODbL); OpenTopoMap (CC BY-SA); ortofoto AGEA 2022-2024 © AGEA (CC BY 4.0); TINITALY/1.1 © INGV, Tarquini et al. 2023, doi:10.13127/tinitaly/1.1 (CC BY 4.0).<br>
        Ricerca delle località: Nominatim, © OpenStreetMap contributors.<br>
        Journal of Maps: indicizzati solo i metadati bibliografici; gli articoli restano di autori ed editore, con la licenza indicata su ciascuno.<br>
        Altre riviste: selezione manuale di carte geologiche allegate ad articoli Open Access con licenza aperta dichiarata; indicizzati solo i metadati, gli articoli restano di autori ed editore.<br>
        Codice: licenza MIT. Dati curati del repository (localizzazioni, selezioni, GeoJSON): licenza CC BY 4.0.</p>
        <p class="meta">Geologiaintasca non è titolare dei dati cartografici collegati: fornisce solo il servizio di indicizzazione geografica.</p>
      </div>`;
    const b = d.querySelector('button'), info = d.querySelector('.info');
    b.onclick = () => { const a = info.classList.toggle('aperto'); b.setAttribute('aria-expanded', a); };
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  testata.addTo(map);
  ricerca.addTo(map);

  // ---------- Legenda ----------
  const legenda = L.control({ position: 'bottomleft' });
  legenda.onAdd = () => {
    const d = L.DomUtil.create('div', 'riquadro legenda');
    // Richiudibile: aperta su schermi grandi, chiusa su telefono. Stesso ordine del pannello dei livelli.
    d.innerHTML = '<button type="button" class="titolo-legenda" aria-expanded="true">Legenda</button><div class="voci-legenda">' +
      '<b>Carta 1:100.000</b><br><i style="background:#6d4c41;opacity:.35"></i>con copia digitale' +
      '<br><i style="background:#6d4c41;opacity:.1"></i>senza copia digitale' +
      '<br><b>Fogli CARG (stato su CARG-GATE)</b><br>' +
      Object.entries(COLORI_CARG).map(([k, c]) => `<i style="background:${c};opacity:.75"></i>${k}`).join('<br>') +
      '<br><i style="background:#fff"></i>Nessuno stato indicato' +
      '<br><b>Geologia ISPRA</b><br><span class="meta">colori della carta ufficiale; clic per i dettagli</span>' +
      `<br><b>Journal of Maps</b><br><i style="background:${COLORE_JOM};border-radius:50%"></i>comune o coordinate` +
      `<br><i style="background:${COLORE_JOM};border-radius:50%;width:14px;height:14px;color:#fff;font:bold 9px/14px sans-serif;text-align:center;font-style:normal;vertical-align:-3px">3</i>più articoli nello stesso punto` +
      `<br><i style="background:${COLORE_JOM_REG};border-radius:3px;width:22px"></i>studi a scala regionale e da localizzare` +
      `<br><b>Altre riviste</b><br><i style="background:${COLORE_ALTRE};border-radius:50%"></i>carta allegata all'articolo (comune o coordinate)</div>`;
    const tb = d.querySelector('.titolo-legenda'), voci = d.querySelector('.voci-legenda');
    const apri = x => { voci.hidden = !x; tb.setAttribute('aria-expanded', x); };
    apri(window.innerWidth > 600);
    tb.onclick = () => apri(voci.hidden);
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  legenda.addTo(map);
</script>
